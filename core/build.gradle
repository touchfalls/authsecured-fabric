plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.0'
}

dependencies {
    // Password Hashing (OWASP Argon2id)
    implementation "com.password4j:password4j:${project.password4j_version}"

    // Database Pooling & Migrations
    implementation "com.zaxxer:HikariCP:${project.hikaricp_version}"
    implementation "org.flywaydb:flyway-core:${project.flyway_version}"
    implementation "org.flywaydb:flyway-database-postgresql:${project.flyway_version}"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.17.1"
    implementation "com.google.code.gson:gson:2.10.1"

    // Database Drivers (sqlite-jdbc 3.46.0.0 contains Fat binaries for macOS osx-x86_64 & osx-aarch64)
    implementation "org.xerial:sqlite-jdbc:${project.sqlite_version}"
    implementation "org.postgresql:postgresql:${project.postgresql_version}"

    // Distributed Cache / Redis
    implementation "redis.clients:jedis:${project.jedis_version}"

    // Logging & Utilities
    implementation "org.slf4j:slf4j-api:${project.slf4j_version}"

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

shadowJar {
    archiveClassifier.set('shaded')

    // Package Relocations to avoid conflicts in Minecraft environment
    relocate 'com.password4j', 'net.authsecured.core.shadow.password4j'
    relocate 'com.zaxxer.hikari', 'net.authsecured.core.shadow.hikari'
    relocate 'org.flywaydb', 'net.authsecured.core.shadow.flyway'
    relocate 'redis.clients.jedis', 'net.authsecured.core.shadow.jedis'
    relocate 'org.sqlite', 'net.authsecured.core.shadow.sqlite'
    relocate 'org.postgresql', 'net.authsecured.core.shadow.postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}
